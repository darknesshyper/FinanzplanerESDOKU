        <span class="navbar-toggler-icon"></span>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">

        </ul>
        <div class="d-flex align-items-center gap-2">

          <a href="anmelden.html" class="btn btn-outline-success">Anmelden</a>

  <section class="gradient-custom">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="card">
            <div class="card-body p-5 text-center">

              <div class="mb-md-5 mt-md-4 pb-5">

                <h2 class="fw-bold mb-2 text-uppercase">Anmelden</h2>
                <p class="text-muted mb-4">Bitte geben Sie Ihre E-Mail und Ihr Passwort ein!</p>

                <div id="errorArea" style="padding: 10px; font-weight: bold; color: red; margin-bottom: 20px;"></div>

                <form id="loginForm">
                  <div data-mdb-input-init class="form-outline form-white mb-4">
                    <input type="email" id="userEmail" class="form-control" />
                    <label class="form-label" for="userEmail">E-Mail</label>
                  </div>

                  <div data-mdb-input-init class="form-outline form-white mb-4">
                    <input type="password" id="userPassword" class="form-control" />
                    <label class="form-label" for="userPassword">Passwort</label>
                  </div>

                  <button type="submit" class="btn btn-success w-100">Anmelden</button>
                </form>



              </div>

              <div>
                <p class="mt-4 mb-0">
                  Noch keinen Account?
                  <a href="registrieren.html" class="fw-bold">Registrieren</a>
                </p>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

  <footer class="footer">
    <div class="footer-content">
      <a href="impressum.html">Impressum</a>
      <span class="separator">|</span>
      <a href="datenschutz.html">Datenschutzerklärung</a>
    </div>
  </footer>

  <script>
    $(document).ready(function () {
      $('#userEmail').keydown(clearErrorArea);
      $('#userPassword').keydown(clearErrorArea);

      $('#loginForm').submit(function (form) {
        form.preventDefault();

        // Get data from form and cleanup with trim
        var email = $('#userEmail').val().trim();
        var password = $('#userPassword').val().trim();

        // Check if data missing
        if (email.length == 0) {
          $('#errorArea').html('Login fehlerhaft, bitte geben Sie die E-Mail ein');
          return;
        }
        if (password.length == 0) {
          $('#errorArea').html('Login fehlerhaft, bitte geben Sie das Passwort ein');
          return;
        }

        // Hash password with md5
        var pwHash = md5(password);

        console.log('formular ausgelöst', email, password, pwHash);

        // Create payload to send via ajax request
        var payload = { 'credentials-email': email, 'credentials-password': pwHash };

        $.ajax({
          url: 'http://localhost:8000/api/token/authenticate',
          method: 'get',
          contentType: 'application/json; charset=utf-8',
          cache: false,
          dataType: 'json',
          headers: payload
        }).done(function (response) {
          console.log('received Response', response);

          // login ok, setting session var with token
          saveToken(response);

          // jump to overview page
          location.href = 'uebersicht.html';

        }).fail(function (jqXHR, statusText, error) {
          console.log('Response Code: ' + jqXHR.status + ' - Error: ' + jqXHR.responseText);
          $('#errorArea').html('Login fehlerhaft, bitte versuchen Sie es erneut!');
        });
      });
    });

    function clearErrorArea() {
      $('#errorArea').empty();
    }
  </script>

</body>

</html>
