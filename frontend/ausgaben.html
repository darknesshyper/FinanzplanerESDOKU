    <script>
        function clearAusgabenErrors() {
            $('#bezeichnung-ausgabe').removeClass('error');
            $('#betrag-ausgabe').removeClass('error');
            $('#kategorie-ausgabe').removeClass('error');
            $('#datum-ausgabe').removeClass('error');
        }

        function markAusgabenFieldsAsError(errorMsg) {
            clearAusgabenErrors();
            
            if (errorMsg.includes('bezeichnung')) {
                $('#bezeichnung-ausgabe').addClass('error');
            }
            if (errorMsg.includes('geldbetrag')) {
                $('#betrag-ausgabe').addClass('error');
            }
            if (errorMsg.includes('kategorie')) {
                $('#kategorie-ausgabe').addClass('error');
            }
            if (errorMsg.includes('datum')) {
                $('#datum-ausgabe').addClass('error');
            }
        }

        $('#ausgabe-hinzufuegen').click(function () {
            console.log('Ausgabe hinzufügen Button geklickt');
            
            clearAusgabenErrors();

            var bezeichnung = $('#bezeichnung-ausgabe').val();
            var geldbetrag = parseFloat($('#betrag-ausgabe').val());
            var kategorie = $('#kategorie-ausgabe').val();
            var datum = $('#datum-ausgabe').val();

            console.log('DEBUG: bezeichnung=' + bezeichnung);
            console.log('DEBUG: geldbetrag=' + geldbetrag);
            console.log('DEBUG: kategorie=' + kategorie);
            console.log('DEBUG: datum=' + datum);

            $.ajax({
                url: 'http://localhost:8000/api/ausgabe',
                method: 'POST',
                contentType: 'application/json; charset=utf-8',
                cache: false,
                data: JSON.stringify({
                    bezeichnung: bezeichnung,
                    geldbetrag: geldbetrag,
                    kategorie: kategorie,
                    datum: datum
                })
            }).done(function (response) {
                console.log(response);
                loadTable();
                // Formular zurücksetzen
                $('#bezeichnung-ausgabe').val('');
                $('#betrag-ausgabe').val('');
                $('#kategorie-ausgabe').val('');
                $('#datum-ausgabe').val('');
                $('#output').html(response);
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                
                try {
                    const errorResponse = JSON.parse(jqXHR.responseText);
                    if (errorResponse.nachricht) {
                        markAusgabenFieldsAsError(errorResponse.nachricht);
                    }
                } catch (e) {
                    console.error('Fehler beim Parsen der Fehlermeldung:', e);
                }
                
                $('#output').html('Ein Fehler ist aufgetreten');
            });
        });


        let allAusgaben = [];

        window.addEventListener("load", loadTable);

        $('#kategorie-ausgabe-uebersicht').change(() => {
            filterAndDisplayTable();
        });

        function formatGeld(zahl) {
            return parseFloat(zahl).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDatum(datum) {
            if (!datum) return datum;
            const parts = datum.split('-');
            return parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function loadTable() {
            console.log('Tabelle aus backend laden');

            $.ajax({
                url: 'http://localhost:8000/api/ausgabe/alle',
                method: 'GET',
                contentType: 'application/json; charset=utf-8',
                cache: false,
            }).done(function (response) {
                allAusgaben = response;
                filterAndDisplayTable();
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                $('#output').html('Ein Fehler beim Laden der Daten aus der DB ist aufgetreten');
            });
        };

        function filterAndDisplayTable() {
            const selectedCategory = $('#kategorie-ausgabe-uebersicht').val();
            console.log('Filter angewendet: ' + selectedCategory);

            let filteredData = allAusgaben;

            if (selectedCategory !== 'all') {
                filteredData = allAusgaben.filter(item => item.kategorie === selectedCategory);
            }

            refreshTable(filteredData);
        }

        function refreshTable(response) {
            console.log('Aus backend geladene Tabelle anzeigen');
            console.log(response);
            const tbody = document.querySelector('#ausgaben-table tbody');
            tbody.innerHTML = '';

            for (let i = 0; i < response.length; i++) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${response[i].bezeichnung}</td>
                    <td>${formatGeld(response[i].geldbetrag)} €</td>
                    <td>${response[i].kategorie}</td>
                    <td>${formatDatum(response[i].datum)}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-outline-primary me-1" title="Bearbeiten">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-delete" title="Löschen" data-id="${response[i].id}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
            updatePiechart_ausgaben(response);
        };

        $(document).on('click', '.btn-delete', function () {
            /*console.log('delete' + $(this).data('id'));*/
            $.ajax({
                url: 'http://localhost:8000/api/ausgabe/' + $(this).data('id'),
                method: 'DELETE',
                contentType: 'application/json; charset=utf-8',
                cache: false,
            }).done(function (response) {
                loadTable();
                $('#output').html(response);
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                $('#output').html('Ein Fehler beim Löschen des Eintrags aus der DB ist aufgetreten');
            });
        });

        const kategoriefarben_ausgaben = {
            'Miete/Wohnen': '#FFA500',
            'Nebenkosten': '#87CEEB',
            'Lebensmittel': '#FFD700',
            'Transport/Benzin': '#FFB6C1',
            'Versicherungen': '#90EE90',
            'Internet/Handy': '#FF6B6B',
            'Freizeit': '#DDA0DD',
            'Restaurants/Essen gehen': '#F4A460',
            'Kleidung': '#20B2AA',
            'Gesundheit/Apotheke': '#FFB347',
            'Abonnements': '#87CEFA',
            'Bildung/Weiterbildung': '#98FB98',
            'Reisen/Urlaub': '#F08080',
            'Haushalt': '#BDB76B',
            'Sonstiges': '#D3D3D3'
        };

        function updatePiechart_ausgaben(data) {
            const summen = {};
            data.forEach(item => {
                const kat = item.kategorie;
                summen[kat] = (summen[kat] || 0) + parseFloat(item.geldbetrag);
            });

            const kategorien = Object.keys(summen);
            const gesamt = Object.values(summen).reduce((a, b) => a + b, 0);

            let gradient = '';
            let aktuellerWinkel = 0;

            kategorien.forEach((kat, index) => {
                const anteil = summen[kat] / gesamt;
                const winkel = anteil * 360;
                const farbe = kategoriefarben_ausgaben[kat] || '#CCCCCC';
                const naechsterWinkel = aktuellerWinkel + winkel;

                gradient += `${farbe} ${aktuellerWinkel.toFixed(2)}deg ${naechsterWinkel.toFixed(2)}deg`;
                if (index < kategorien.length - 1) gradient += ', ';

                aktuellerWinkel = naechsterWinkel;
            });

            if (kategorien.length === 0) {
                document.querySelector('.piechart_ausgaben').style.backgroundImage =
                    'conic-gradient(#e0e0e0 0deg 360deg)';
            } else {
                document.querySelector('.piechart_ausgaben').style.backgroundImage =
                    `conic-gradient(${gradient})`;
            }

            const legend = document.getElementById('ausgaben-legend');
            legend.innerHTML = '';

            kategorien.forEach(kat => {
                const farbe = kategoriefarben_ausgaben[kat] || '#CCCCCC';
                const prozent = ((summen[kat] / gesamt) * 100).toFixed(1);
                const betragFormatiert = summen[kat].toLocaleString('de-DE', {
                    minimumFractionDigits: 2, maximumFractionDigits: 2
                });

                legend.innerHTML += `
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${farbe};"></div>
                        <span class="legend-text">
                            <strong>${kat}:</strong> ${betragFormatiert} € (${prozent}%)
                        </span>
                    </div>`;
            });

            const gesamtFormatiert = gesamt.toLocaleString('de-DE', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
           document.getElementById('ausgaben-gesamt').innerHTML =
            `<span>Gesamt: ${gesamtFormatiert} €</span>`;
        }
    </script>
