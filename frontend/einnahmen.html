    <script>
        function clearEinnahmenErrors() {
            $('#bezeichnung-einnahme').removeClass('error');
            $('#betrag-einnahme').removeClass('error');
            $('#kategorie-einnahme').removeClass('error');
            $('#datum-einnahme').removeClass('error');
        }

        function markEinnahmenFieldsAsError(errorMsg) {
            clearEinnahmenErrors();

            if (errorMsg.includes('bezeichnung')) {
                $('#bezeichnung-einnahme').addClass('error');
            }
            if (errorMsg.includes('geldbetrag')) {
                $('#betrag-einnahme').addClass('error');
            }
            if (errorMsg.includes('kategorie')) {
                $('#kategorie-einnahme').addClass('error');
            }
            if (errorMsg.includes('datum')) {
                $('#datum-einnahme').addClass('error');
            }
        }

        $('#einnahme-hinzufuegen').click(function () {
            console.log('Einnahme hinzufügen Button geklickt');

            clearEinnahmenErrors();

            var bezeichnung = $('#bezeichnung-einnahme').val();
            var geldbetrag = parseFloat($('#betrag-einnahme').val());
            var kategorie = $('#kategorie-einnahme').val();
            var datum = $('#datum-einnahme').val();

            console.log('DEBUG: bezeichnung=' + bezeichnung);
            console.log('DEBUG: geldbetrag=' + geldbetrag);
            console.log('DEBUG: kategorie=' + kategorie);
            console.log('DEBUG: datum=' + datum);

            var credentials = getJSONSessionItem('credentials');

            $.ajax({
                url: 'http://localhost:8000/api/einnahme',
                method: 'POST',
                contentType: 'application/json; charset=utf-8',
                cache: false,
                headers: { 'Authorization': 'Bearer ' + credentials.token },
                data: JSON.stringify({
                    bezeichnung: bezeichnung,
                    geldbetrag: geldbetrag,
                    kategorie: kategorie,
                    datum: datum
                })
            }).done(function (response) {
                console.log(response);
                loadTable();
                // Formular zurücksetzen
                $('#bezeichnung-einnahme').val('');
                $('#betrag-einnahme').val('');
                $('#kategorie-einnahme').val('');
                $('#datum-einnahme').val('');
                $('#output').html(response);
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);

                try {
                    const errorResponse = JSON.parse(jqXHR.responseText);
                    if (errorResponse.nachricht) {
                        markEinnahmenFieldsAsError(errorResponse.nachricht);
                    }
                } catch (e) {
                    console.error('Fehler beim Parsen der Fehlermeldung:', e);
                }

                $('#output').html('Ein Fehler ist aufgetreten');
            });
        });

        let allEinnahmen = [];

        window.addEventListener("load", loadTable);

        $('#kategorie-einnahme-uebersicht').change(() => {
            filterAndDisplayTable();
        });

        $('#uebersicht-month').change(() => {
            filterAndDisplayTable();
        });

        $('#uebersicht-year').change(() => {
            filterAndDisplayTable();
        });

        function formatGeld(zahl) {
            return parseFloat(zahl).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDatum(datum) {
            if (!datum) return datum;
            const parts = datum.split('-');
            return parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function loadTable() {
            console.log('Tabelle aus backend laden und anzeigen');

            var credentials = getJSONSessionItem('credentials');
            if (!credentials || !credentials.token) {
                console.log('Kein Token vorhanden, bitte anmelden');
                location.href = 'anmelden.html';
                return;
            }

            $.ajax({
                url: 'http://localhost:8000/api/einnahme/alle',
                method: 'GET',
                contentType: 'application/json; charset=utf-8',
                cache: false,
                headers: { 'Authorization': 'Bearer ' + credentials.token }
            }).done(function (response) {
                allEinnahmen = response;
                filterAndDisplayTable();


                const params = new URLSearchParams(window.location.search);
                const editId = params.get('edit');
                if (editId) {
                    setTimeout(() => {
                        $(`button.btn-edit[data-id="${editId}"]`).click();

                        window.history.replaceState({}, document.title, window.location.pathname);
                    }, 100);
                }
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                if (jqXHR.status === 401) {
                    location.href = 'anmelden.html';
                }
            });
        };

        function filterAndDisplayTable() {
            const selectedCategory = $('#kategorie-einnahme-uebersicht').val();
            console.log('Filter angewendet: ' + selectedCategory);

            let filteredData = allEinnahmen;

            if (selectedCategory !== 'all') {
                filteredData = allEinnahmen.filter(item => item.kategorie === selectedCategory);
            }

            const selectedMonth = $('#uebersicht-month').val();
            console.log('Monatsfilter: ' + selectedMonth);

            if (selectedMonth !== 'all') {
                const monthMap = {
                    'jan': '01',
                    'feb': '02',
                    'mar': '03',
                    'apr': '04',
                    'mai': '05',
                    'jun': '06',
                    'jul': '07',
                    'aug': '08',
                    'sep': '09',
                    'okt': '10',
                    'nov': '11',
                    'dez': '12'
                };
                const monthNum = monthMap[selectedMonth];
                filteredData = filteredData.filter(item => item.datum.split('-')[1] === monthNum);
            }

            const selectedYear = $('#uebersicht-year').val();
            console.log('Jahresfilter: ' + selectedYear);

            if (selectedYear !== 'all') {
                const yearMap = {
                    '2026': '2026',
                    '2025': '2025',
                    '2024': '2024',
                    '2023': '2023',
                    '2022': '2022'
                };
                const yearNum = yearMap[selectedYear];
                filteredData = filteredData.filter(item => item.datum.split('-')[0] === yearNum);
            }

            filteredData = filteredData.slice().sort((a, b) => new Date(b.datum) - new Date(a.datum))

            refreshTable(filteredData);
        }

        function refreshTable(response) {
            console.log(response);
            const tbody = document.querySelector('#einnahmen-table tbody');
            tbody.innerHTML = '';

            for (let i = 0; i < response.length; i++) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${response[i].bezeichnung}</td>
                    <td>${formatGeld(response[i].geldbetrag)} €</td>
                    <td>${response[i].kategorie}</td>
                    <td>${formatDatum(response[i].datum)}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-outline-primary me-1 btn-edit" data-id="${response[i].id}" title="Bearbeiten">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${response[i].id}" title="Löschen">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
            updatePiechart_einnahmen(response);
        };

        $(document).on('click', '.btn-delete', function () {
            /*console.log('delete' + $(this).data('id'));*/
            var credentials = getJSONSessionItem('credentials');

            $.ajax({
                url: 'http://localhost:8000/api/einnahme/' + $(this).data('id'),
                method: 'DELETE',
                contentType: 'application/json; charset=utf-8',
                cache: false,
                headers: { 'Authorization': 'Bearer ' + credentials.token }
            }).done(function (response) {
                loadTable();
                $('#output').html(response);
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                $('#output').html('Ein Fehler beim Löschen des Eintrags aus der DB ist aufgetreten');
            });
        });

        const kategoriefarben_einnahmen = {
            'Gehalt/Lohn': '#FFD700',
            'Nebenjob': '#87CEEB',
            'Bonus/Prämien': '#90EE90',
            'Zinsen': '#FFB6C1',
            'Mieteinnahmen': '#FFA500',
            'Staatliche Leistungen': '#FFB347',
            'Geschenke': '#DDA0DD',
            'Sonstiges': '#D3D3D3'
        };

        function updatePiechart_einnahmen(data) {
            const summen = {};
            data.forEach(item => {
                const kat = item.kategorie;
                summen[kat] = (summen[kat] || 0) + parseFloat(item.geldbetrag);
            });

            const kategorien = Object.keys(summen);
            const gesamt = Object.values(summen).reduce((a, b) => a + b, 0);

            let gradient = '';
            let aktuellerWinkel = 0;

            kategorien.forEach((kat, index) => {
                const anteil = summen[kat] / gesamt;
                const winkel = anteil * 360;
                const farbe = kategoriefarben_einnahmen[kat] || '#CCCCCC';
                const naechsterWinkel = aktuellerWinkel + winkel;

                gradient += `${farbe} ${aktuellerWinkel.toFixed(2)}deg ${naechsterWinkel.toFixed(2)}deg`;
                if (index < kategorien.length - 1) gradient += ', ';

                aktuellerWinkel = naechsterWinkel;
            });

            if (kategorien.length === 0) {
                document.querySelector('.piechart_einnahmen').style.backgroundImage =
                    'conic-gradient(#e0e0e0 0deg 360deg)';
            } else {
                document.querySelector('.piechart_einnahmen').style.backgroundImage =
                    `conic-gradient(${gradient})`;
            }

            const legend = document.getElementById('einnahmen-legend');
            legend.innerHTML = '';

            kategorien.forEach(kat => {
                const farbe = kategoriefarben_einnahmen[kat] || '#CCCCCC';
                const prozent = ((summen[kat] / gesamt) * 100).toFixed(1);
                const betragFormatiert = summen[kat].toLocaleString('de-DE', {
                    minimumFractionDigits: 2, maximumFractionDigits: 2
                });

                legend.innerHTML += `
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: ${farbe};"></div>
                        <span class="legend-text">
                            <strong>${kat}:</strong> ${betragFormatiert} € (${prozent}%)
                        </span>
                    </div>`;
            });

            const gesamtFormatiert = gesamt.toLocaleString('de-DE', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
            document.getElementById('einnahmen-gesamt').innerHTML =
                `<span>Gesamt: ${gesamtFormatiert} €</span>`;
        }

        $(document).on('click', '.btn-edit', function () {
            var credentials = getJSONSessionItem('credentials');

            $.ajax({
                url: 'http://localhost:8000/api/einnahme/gib/' + $(this).data('id'),
                method: 'GET',
                contentType: 'application/json; charset=utf-8',
                cache: false,
                headers: { 'Authorization': 'Bearer ' + credentials.token }
            }).done(function (response) {
                einnahme = response;

                document.querySelector('#einnahme-heading').innerHTML = 'Einnahme bearbeiten';
                document.querySelector('#bezeichnung-einnahme').value = einnahme.bezeichnung;
                document.querySelector('#betrag-einnahme').value = einnahme.geldbetrag
                document.querySelector('#kategorie-einnahme').value = einnahme.kategorie;
                document.querySelector('#datum-einnahme').value = einnahme.datum;

                document.querySelector('#einnahme-hinzufuegen').style.display = 'none';
                document.querySelector('#btn-bearbeiten').style.display = '';

                $('#output').html(response);
            }).fail(function (jqXHR, statusText, error) {
                console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                $('#output').html('Ein Fehler beim Laden des Eintrags aus der DB ist aufgetreten');
            });

            $(document).on('click', '#einnahme-speichern', function () {
                var credentials = getJSONSessionItem('credentials');

                $.ajax({
                    url: 'http://localhost:8000/api/einnahme',
                    method: 'PUT',
                    contentType: 'application/json; charset=utf-8',
                    cache: false,
                    headers: { 'Authorization': 'Bearer ' + credentials.token },
                    data: JSON.stringify({
                        id: einnahme.id,
                        bezeichnung: $('#bezeichnung-einnahme').val(),
                        geldbetrag: $('#betrag-einnahme').val(),
                        kategorie: $('#kategorie-einnahme').val(),
                        datum: $('#datum-einnahme').val()
                    })
                }).done(function (response) {
                    document.querySelector('#einnahme-heading').innerHTML = 'Neue Einnahme hinzufügen';
                    document.querySelector('#bezeichnung-einnahme').value = '';
                    document.querySelector('#betrag-einnahme').value = '';
                    document.querySelector('#kategorie-einnahme').value = '';
                    document.querySelector('#datum-einnahme').value = '';
                    loadTable();
                    document.querySelector('#einnahme-hinzufuegen').style.display = '';
                    document.querySelector('#btn-bearbeiten').style.display = 'none';
                    $('#output').html(response);
                }).fail(function (jqXHR, statusText, error) {
                    console.log('Response Code: ' + jqXHR.status + ' - Fehlermeldung: ' + jqXHR.responseText);
                    $('#output').html('Ein Fehler beim Laden des Eintrags aus der DB ist aufgetreten');
                });
            });

            $(document).on('click', '#einnahme-verwerfen', function () {

                document.querySelector('#einnahme-heading').innerHTML = 'Neue Einnahme hinzufügen';
                document.querySelector('#bezeichnung-einnahme').value = '';
                document.querySelector('#betrag-einnahme').value = '';
                document.querySelector('#kategorie-einnahme').value = '';
                document.querySelector('#datum-einnahme').value = '';
                loadTable();
                document.querySelector('#einnahme-hinzufuegen').style.display = '';
                document.querySelector('#btn-bearbeiten').style.display = 'none';
                $('#output').html(response);
            });
        });
        $('#nav-button').click(function () {
            console.log('Benutzer wird abgemeldet...');
            clearSession();
            location.href = 'index.html';
        });
    </script>
